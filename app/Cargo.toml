[package]
name = "hrtf-renderer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bevy = "0.20.1"
bevy_lunex = { git = "https://github.com/bytestring-net/bevy_lunex" }
tch = "=0.22.0"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# for more optimizations cf. https://bevy.org/learn/quick-start/getting-started/setup/
