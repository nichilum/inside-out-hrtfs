[package]
name = "hrtf-renderer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bevy = "0.20.0"
bevy_egui = "0.43.1"
cpal = "0.18.2"
egui-scale = "0.6.1"
hound = "3.5.1"
ringbuf = "0.6.0"
sofar = "0.4.0"
tch = "=0.22.0"
wgpu-types = "30.0.2"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# for more optimizations cf. https://bevy.org/learn/quick-start/getting-started/setup/
