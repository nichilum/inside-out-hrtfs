[project]
name = "ml"
version = "0.1.0"
description = ""
readme = "README.md"
authors = []
requires-python = ">=3.13"
dependencies = [
    "pyfar>=0.8.1",
    "sofar>=1.3.0",
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
